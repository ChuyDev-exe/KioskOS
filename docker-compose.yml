services:
    adagi_os:
        build: .
        privileged: true
        stdin_open: true
        tty: true
        image: adagi_os:latest
        volumes:
            - ./kiosk_os:/home/imagegen/kiosk_os
    
    manager-os:
        build:
            context: ./manager-os
            dockerfile: Dockerfile.manager
        stdin_open: true
        tty: true
        image: manager-os:latest
        environment:
            CARGO_TARGET_DIR: /app/target
        volumes:
            - ./manager-os:/app
            - cargo-target:/app/target
            - cargo-registry:/usr/local/cargo/registry

volumes:
    cargo-target:
    cargo-registry:
