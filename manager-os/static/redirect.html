<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Cargando</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0b0f14;
        color: #8b98a5;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        font-size: 15px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #3b82f6;
        stroke-width: 1.5;
        stroke-linecap: round;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-6.22-8.56" />
    </svg>
    <span>Cargando el kiosco…</span>
    <script>
      setTimeout(function () {
        window.location.href = "{{KIOSK_HOMEPAGE_URL}}";
      }, 500);
    </script>
  </body>
</html>
