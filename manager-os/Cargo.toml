[package]
name = "wifi_setup_service"
version = "0.1.0"
edition = "2021"
# Matches the toolchain of Dockerfile.manager: cargo update only picks
# dependency versions that still build with it.
rust-version = "1.90"

[dependencies]
# default-features disabled to drop the compression stack (zstd/brotli/gzip).
# The service only talks to localhost, so compression is unused — and it removes
# the C dependency (zstd-sys) that breaks aarch64 cross-compilation in CI.
actix-web = { version = "4", default-features = false, features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-files = "0.6"

# Touch bridge (src/touch_bridge.rs): Linux only, so the service still builds
# and runs on macOS for local development. Pure Rust, no C toolchain needed.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
