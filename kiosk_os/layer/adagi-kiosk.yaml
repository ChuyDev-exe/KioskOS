# METABEGIN
# X-Env-Layer-Name: adagi-kiosk
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: KioskOS – WiFi setup wizard (Rust/actix-web) and WPE WebKit (cog) kiosk launcher via labwc/Wayland
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: adagi-wifi
# X-Env-VarPrefix: kiosk
# X-Env-Var-homepage_url: https://www.berel.com/
# X-Env-Var-homepage_url-Desc: URL the kiosk browser loads when WiFi is connected
# X-Env-Var-homepage_url-Required: n
# X-Env-Var-homepage_url-Valid: string
# X-Env-Var-homepage_url-Set: y
# X-Env-Var-rotation: normal
# X-Env-Var-rotation-Desc: Screen rotation angle applied via wlr-randr (normal, 90, 180, 270)
# X-Env-Var-rotation-Required: n
# X-Env-Var-rotation-Valid: keywords:0,normal,90,180,270
# X-Env-Var-rotation-Set: y
# X-Env-Var-wifi_ssid:
# X-Env-Var-wifi_ssid-Desc: Optional preconfigured WiFi SSID for first boot
# X-Env-Var-wifi_ssid-Required: n
# X-Env-Var-wifi_ssid-Valid: string
# X-Env-Var-wifi_ssid-Set: n
# X-Env-Var-wifi_psk:
# X-Env-Var-wifi_psk-Desc: Optional WiFi password (WPA/WPA2) for preconfigured SSID
# X-Env-Var-wifi_psk-Required: n
# X-Env-Var-wifi_psk-Valid: string
# X-Env-Var-wifi_psk-Set: n
# X-Env-Var-wifi_country: US
# X-Env-Var-wifi_country-Desc: Two-letter Wi-Fi regulatory domain (ISO 3166-1, e.g. MX, US, ES)
# X-Env-Var-wifi_country-Required: n
# X-Env-Var-wifi_country-Valid: string
# X-Env-Var-wifi_country-Set: y
# X-Env-Var-touch_bridge: auto
# X-Env-Var-touch_bridge-Desc: Turn touch foils / IR frames detected as an absolute mouse into a touchscreen (auto, force, off)
# X-Env-Var-touch_bridge-Required: n
# X-Env-Var-touch_bridge-Valid: keywords:auto,force,off
# X-Env-Var-touch_bridge-Set: y
# X-Env-Var-usbhid_quirks:
# X-Env-Var-usbhid_quirks-Desc: Optional usbhid.quirks kernel parameter, e.g. 0x1234:0x5678:0x40 (comma separated)
# X-Env-Var-usbhid_quirks-Required: n
# X-Env-Var-usbhid_quirks-Valid: string
# X-Env-Var-usbhid_quirks-Set: n
# X-Env-Var-ssh_enable: 1
# X-Env-Var-ssh_enable-Desc: Enable SSH service on first boot (1 or 0)
# X-Env-Var-ssh_enable-Required: n
# X-Env-Var-ssh_enable-Valid: keywords:0,1,true,false
# X-Env-Var-ssh_enable-Set: y
# X-Env-Var-ssh_authorized_key:
# X-Env-Var-ssh_authorized_key-Desc: Optional public key added to ~/.ssh/authorized_keys
# X-Env-Var-ssh_authorized_key-Required: n
# X-Env-Var-ssh_authorized_key-Valid: string
# X-Env-Var-ssh_authorized_key-Set: n
# METAEND
---
mmdebstrap:
  packages:
    - plymouth
    - plymouth-themes
    - labwc
    - wvkbd
    - wlr-randr
    # WPE WebKit browser (cog launcher, Wayland platform plug-in included).
    - cog
    # Not pulled in with install-recommends=false, but required at runtime:
    # TLS for libsoup (no HTTPS without it), fonts (text would not render),
    # and the Mesa EGL/DRI drivers used by the WPE FDO backend on vc4.
    - glib-networking
    - fontconfig
    - fonts-dejavu-core
    - libegl-mesa0
    - libgl1-mesa-dri
    - openssh-server
    # Input diagnostics for touch foils / IR frames (kiosk-input-diag).
    - usbutils
    - evtest
    - avahi-daemon
  install-recommends: false
  customize-hooks:
    - |-
      set -eu

      CONFD="$SRCROOT/image/mbr/simple_dual/kiosk-conf"
      OVERLAY="$SRCROOT/image/mbr/simple_dual/device/rootfs-overlay"
      PLYMOUTH_SRC="$SRCROOT/image/mbr/simple_dual/plymouth/themes/KioskOs"

      ROTATION="${IGconf_kiosk_rotation:-normal}"
      WIFI_SSID="${IGconf_kiosk_wifi_ssid:-}"
      WIFI_PSK="${IGconf_kiosk_wifi_psk:-}"
      WIFI_COUNTRY="${IGconf_kiosk_wifi_country:-US}"
      TOUCH_BRIDGE="${IGconf_kiosk_touch_bridge:-auto}"
      USBHID_QUIRKS="${IGconf_kiosk_usbhid_quirks:-}"
      SSH_ENABLE="${IGconf_kiosk_ssh_enable:-1}"
      SSH_AUTHORIZED_KEY="${IGconf_kiosk_ssh_authorized_key:-}"

      # Map numeric 0 to "normal" for wlr-randr compatibility
      if [ "$ROTATION" = "0" ]; then
          ROTATION="normal"
      fi
      case "$ROTATION" in
          90) TOUCH_MATRIX="0 -1 1 1 0 0" ;;
          180) TOUCH_MATRIX="-1 0 1 0 -1 1" ;;
          270) TOUCH_MATRIX="0 1 0 -1 0 1" ;;
          *) TOUCH_MATRIX="1 0 0 0 1 0" ;;
      esac

      # ── Create kiosk user (replaces the removed rpi-user-credentials layer) ──
      chroot "$1" sh -c "useradd -m -s /bin/bash -u 4000 '${IGconf_device_user1}'" 2>/dev/null || true
      if [ -n "${IGconf_device_user1passhash:-}" ]; then
        chroot "$1" sh -c "usermod --password '${IGconf_device_user1passhash}' '${IGconf_device_user1}'"
      fi
      chroot "$1" usermod --pass='*' root

      # ── Directories ────────────────────────────────────────────────────────
      mkdir -p "$1/etc/wpa_supplicant"
      mkdir -p "$1/usr/local/bin"
      mkdir -p "$1/static"
      mkdir -p "$1/etc/systemd/system"
      mkdir -p "$1/etc/udev/rules.d"
      mkdir -p "$1/boot/firmware"

      # ── unblock-wifi.service ───────────────────────────────────────────────
      install -m 644 "$CONFD/unblock-wifi.service" \
          "$1/etc/systemd/system/unblock-wifi.service"

      # ── wpa_supplicant@wlan0.service ───────────────────────────────────────
      install -m 644 \
          "$OVERLAY/etc/systemd/system/wpa_supplicant@wlan0.service" \
          "$1/etc/systemd/system/wpa_supplicant@wlan0.service"

      # ── Optional preconfigured WiFi for first boot ────────────────────────
      # wpa_supplicant does NOT process escapes inside ssid="..." or
      # psk="..." (it reads up to the last quote literally), so the old
      # backslash escaping broke SSIDs/passwords with quotes or backslashes.
      # The SSID goes hex-encoded (valid for any bytes) and the passphrase
      # verbatim; build.sh already validated its length and characters.
      if [ -n "$WIFI_SSID" ]; then
          WIFI_SSID_HEX=$(printf '%s' "$WIFI_SSID" | od -An -tx1 -v | tr -d ' \n')
          if [ -z "$WIFI_PSK" ]; then
              WIFI_SECURITY='    key_mgmt=NONE'
          elif printf '%s' "$WIFI_PSK" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
              WIFI_SECURITY="    psk=${WIFI_PSK}"
          else
              WIFI_SECURITY="    psk=\"${WIFI_PSK}\""
          fi
          ( umask 077
            printf '%s\n' \
                'ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev' \
                'update_config=1' \
                "country=${WIFI_COUNTRY}" \
                '' \
                'network={' \
                "    ssid=${WIFI_SSID_HEX}" \
                '    scan_ssid=1' \
                "${WIFI_SECURITY}" \
                '}' \
                > "$1/etc/wpa_supplicant/wpa_supplicant-wlan0.conf" )
          chmod 600 "$1/etc/wpa_supplicant/wpa_supplicant-wlan0.conf"
      fi

      # ── wifi_setup.service (from template) ────────────────────────────────
      # Escape the URL twice: '%' -> '%%' for systemd (it would read %xx
      # as a unit specifier), then '&', '|' and '\' for the sed replacement
      # (an unescaped '&' in a query string is replaced by the matched text).
      HOMEPAGE_URL_ESC=$(printf '%s' "${IGconf_kiosk_homepage_url}" | sed -e 's/%/%%/g' -e 's/[&|\\]/\\&/g')
      sed \
          -e "s|<KIOSK_HOMEPAGE_URL>|${HOMEPAGE_URL_ESC}|g" \
          -e "s|<KIOSK_WIFI_COUNTRY>|${WIFI_COUNTRY}|g" \
          "$CONFD/wifi_setup.service.tpl" \
          > "$1/etc/systemd/system/wifi_setup.service"

      # ── kiosk-launch.sh (from template) ───────────────────────────────────
      sed \
          -e "s|<KIOSK_ROTATION>|${ROTATION}|g" \
          -e "s|<KIOSK_USER>|${IGconf_device_user1}|g" \
          "$CONFD/kiosk-launch.sh.tpl" \
          > "$1/usr/local/bin/kiosk-launch.sh"
      chmod +x "$1/usr/local/bin/kiosk-launch.sh"

      # ── kiosk.service (from template) ─────────────────────────────────────
      sed \
          -e "s|<KIOSK_USER>|${IGconf_device_user1}|g" \
          -e "s|<KIOSK_RUNDIR>|/home/${IGconf_device_user1}|g" \
          "$CONFD/kiosk.service.tpl" \
          > "$1/etc/systemd/system/kiosk.service"

      # ── labwc config ─────────────────────────────────────────────────────
      LABWC_CFG="$1/home/${IGconf_device_user1}/.config/labwc"
      mkdir -p "$LABWC_CFG"
      sed \
          -e "s|<KIOSK_ROTATION>|${ROTATION}|g" \
          "$CONFD/labwc-autostart.sh.tpl" \
          > "$LABWC_CFG/autostart"
      chmod +x "$LABWC_CFG/autostart"
      install -m 644 "$CONFD/labwc-rc.xml.tpl" "$LABWC_CFG/rc.xml"
      chroot "$1" chown -R ${IGconf_device_user1}:${IGconf_device_user1} "/home/${IGconf_device_user1}/.config"

      # ── wifi_setup_service binary (aarch64, cross-compiled) ───────────────
      install -m 755 \
          "$OVERLAY/usr/local/bin/wifi_setup_service" \
          "$1/usr/local/bin/wifi_setup_service"

      # ── Browser (WPE WebKit / cog) ─────────────────────────────────────────
      # No profile or policy files are needed: zoom, crash recovery and window
      # mode are command-line options/environment in kiosk-launch.sh, and the
      # HTTP cache lives in tmpfs (XDG_CACHE_HOME in kiosk.service).
      mkdir -p "$1/home/${IGconf_device_user1}/.local/share"
      chroot "$1" chown -R ${IGconf_device_user1}:${IGconf_device_user1} "/home/${IGconf_device_user1}/.local"

      # ── Optional SSH key for kiosk user ───────────────────────────────────
      if [ -n "$SSH_AUTHORIZED_KEY" ]; then
          SSH_DIR="$1/home/${IGconf_device_user1}/.ssh"
          mkdir -p "$SSH_DIR"
          printf '%s\n' "$SSH_AUTHORIZED_KEY" > "$SSH_DIR/authorized_keys"
          chmod 700 "$SSH_DIR"
          chmod 600 "$SSH_DIR/authorized_keys"
          chroot "$1" chown -R ${IGconf_device_user1}:${IGconf_device_user1} "/home/${IGconf_device_user1}/.ssh"
      fi

      # ── Static frontend files ──────────────────────────────────────────────
      cp -r "$OVERLAY/static/." "$1/static/"

      # ── Boot config for the target board ─────────────────────────────────
      # Pick the overlay that matches the device (it used to be the Pi 4 one
      # for every board). device.class is set by the rpi device layer.
      case "${IGconf_device_class:-${IGconf_device_layer:-pi4}}" in
          pi3|rpi3|zero2w|rpi-zero2w) BOOT_OVERLAY=pi3 ;;
          pi5|rpi5|cm5|rpi-cm5) BOOT_OVERLAY=pi5 ;;
          *) BOOT_OVERLAY=pi4 ;;
      esac
      echo "adagi-kiosk: using the ${BOOT_OVERLAY} boot configuration"
      install -m 644 \
          "$SRCROOT/device/${BOOT_OVERLAY}/device/rootfs-overlay/boot/firmware/config.txt" \
          "$1/boot/firmware/config.txt"
      install -m 644 \
          "$SRCROOT/device/${BOOT_OVERLAY}/device/rootfs-overlay/boot/firmware/cmdline.txt" \
          "$1/boot/firmware/cmdline.txt"

      # ── Touch rotation (libinput) ────────────────────────────────────────
      # Touchscreens (including the touch bridge output) and absolute
      # pointers (touch foils / IR frames left in mouse mode, tablets).
      # libinput only applies the matrix to absolute devices, so regular
      # relative mice are not affected.
      printf '%s\n' \
          'ACTION=="add|change", SUBSYSTEM=="input", ENV{ID_INPUT_TOUCHSCREEN}=="1", ENV{LIBINPUT_CALIBRATION_MATRIX}="'"${TOUCH_MATRIX}"'"' \
          'ACTION=="add|change", SUBSYSTEM=="input", ENV{ID_INPUT_TABLET}=="1", ENV{LIBINPUT_CALIBRATION_MATRIX}="'"${TOUCH_MATRIX}"'"' \
          'ACTION=="add|change", SUBSYSTEM=="input", ENV{ID_INPUT_MOUSE}=="1", ENV{LIBINPUT_CALIBRATION_MATRIX}="'"${TOUCH_MATRIX}"'"' \
          > "$1/etc/udev/rules.d/99-touchscreen-rotation.rules"

      # ── Touch foils / IR frames in mouse mode → touchscreen ──────────────
      install -m 755 "$CONFD/kiosk-input-diag.sh" "$1/usr/local/bin/kiosk-input-diag"
      if [ "$TOUCH_BRIDGE" != "off" ]; then
          install -m 644 "$CONFD/99-kiosk-touch-bridge.rules" \
              "$1/etc/udev/rules.d/99-kiosk-touch-bridge.rules"
          sed -e "s|<KIOSK_TOUCH_BRIDGE>|${TOUCH_BRIDGE}|g" \
              "$CONFD/kiosk-touch-bridge@.service.tpl" \
              > "$1/etc/systemd/system/kiosk-touch-bridge@.service"
          mkdir -p "$1/etc/modules-load.d"
          echo uinput > "$1/etc/modules-load.d/kiosk-uinput.conf"
      fi

      # Kernel HID quirks, e.g. 0x40 (HID_QUIRK_MULTI_INPUT) splits a device
      # that hides its touch collection behind the mouse one.
      if [ -n "$USBHID_QUIRKS" ]; then
          sed -i "1 s|\$| usbhid.quirks=${USBHID_QUIRKS}|" "$1/boot/firmware/cmdline.txt"
      fi

      # ── Plymouth splash screen ────────────────────────────────────────────
      mkdir -p "$1/usr/share/plymouth/themes/KioskOs"
      cp -r "$PLYMOUTH_SRC/." "$1/usr/share/plymouth/themes/KioskOs/"
      chmod 755 "$1/usr/share/plymouth/themes/KioskOs"
      chmod 644 "$1/usr/share/plymouth/themes/KioskOs/"*
      chroot "$1" plymouth-set-default-theme KioskOs

      # ── HW watchdog (systemd) ─────────────────────────────────────────────
      mkdir -p "$1/etc/systemd/system.conf.d"
      printf '%s\n' \
          '[Manager]' \
          'RuntimeWatchdogSec=15s' \
          > "$1/etc/systemd/system.conf.d/watchdog.conf"

      # ── Enable systemd units ───────────────────────────────────────────────
      systemctl --root="$1" enable wifi_setup.service
      systemctl --root="$1" enable wpa_supplicant@wlan0.service
      systemctl --root="$1" enable kiosk.service
      systemctl --root="$1" enable unblock-wifi.service
      systemctl --root="$1" enable avahi-daemon.service
      if [ "$SSH_ENABLE" = "1" ] || [ "$SSH_ENABLE" = "true" ]; then
          systemctl --root="$1" enable ssh.service || systemctl --root="$1" enable ssh
      fi

      # ── Mask getty on tty1 (prevent login prompt) ─────────────────────────
      systemctl --root="$1" mask getty@tty1.service

      # ── Image size cleanup ─────────────────────────────────────────────────
      # The root partition is sized from the content (image.root_part_size in
      # config/adagi_os.yaml), so every megabyte removed here shrinks the
      # final .img. The Mesa/LLVM stack is now the biggest chunk; it is a hard
      # dependency of the GL/EGL stack and cannot be dropped. (firefox-esr,
      # ~272 MB, was replaced by WPE WebKit.)
      #
      # The host-side APT cache (sys.apt_cachedir) makes rpi-image-gen skip
      # the APT lists/cache cleanup, so the lists would end up inside the
      # image. Drop them here instead.
      #
      # NOTE: /var/cache/apt/archives is a bind mount of the host cache while
      # the build runs. Do NOT delete the .deb files from here: that would
      # wipe the host cache too. mmdebstrap unmounts it before the image is
      # assembled, so the archives never reach the image.
      rm -rf "$1/var/lib/apt/lists/"* || true
      # Documentation and man pages are useless on an unattended kiosk.
      rm -rf "$1/usr/share/doc/"* || true
      rm -rf "$1/usr/share/man/"* || true
      rm -rf "$1/usr/share/info/"* || true
