name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    # Cross-linker for the aarch64 release build. No C cross-compiler is needed:
    # the service has no C dependencies (compression stack is disabled in Cargo.toml).
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager-os
      - run: cd manager-os && cargo fmt --check
      - run: cd manager-os && cargo clippy --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cd manager-os && cargo build --release --target aarch64-unknown-linux-gnu
      - run: cd manager-os && cargo test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - run: shellcheck build.sh scripts/*.sh kiosk_os/image/mbr/simple_dual/kiosk-conf/kiosk-launch.sh.tpl kiosk_os/image/mbr/simple_dual/kiosk-conf/labwc-autostart.sh.tpl
      - run: yamllint kiosk_os/**/*.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier --check "manager-os/static/**/*.{js,css,html}"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cd manager-os && cargo generate-lockfile
      - run: cd manager-os && cargo audit
